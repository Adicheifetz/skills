{
  "name": "automations/create-numeric-input-mapping",
  "description": "Nested arithmetic and string composition use numeric conversion and live payload values.",
  "triggerPrompt": "Set up an automation called \"Order reserve estimate\": every time someone places an order, I want a note in my Wix Inbox whose title is \"Reserve estimate for order\", then the order number and a colon, then 10% of the order total, all in the title. It's just a rough number, so don't format it as money or round it. Go ahead and save it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require a Show in Inbox (inbox-send-message) step whose formMessage.title uses the actual order-number field and one tenth of the actual order-total amount, written as divide(<total>;10) or multiply(<total>;divide(1;10)), with toNumber() if the schema uses strings. A decimal literal such as 0.1 or .1 fails: the builder's parser rejects it. For order number 42 and total 125, the title conveys Reserve estimate for order 42: 12.5. Adding 10, using 10 times the total, concatenating a percent sign, hardcoding 12.5, or using subtotal fails. Inspect nested expression syntax and field types in the inputMapping the agent submits in its Create Automation request. No unnecessary code-variable step. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize premature currency formatting or rounding followed by repairs, and guessing order amount/number paths rather than inspecting the trigger schema once. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows a Create Automation request whose body sets configuration.status INACTIVE and carries the requested configuration, then a separate Get Automation call for the automation ID the agent reports, made after the Create, and a final answer that reports that ID as saved and inactive. Tool response bodies may be abbreviated or missing in what you see: judge the requests and the final answer, and do not fail a run only because a response body is not shown. Score 0 for a missing read-back call, a Create with status ACTIVE, creating the same automation more than once, any Update, activation, deactivation, Test Automation, deletion or unrelated write, or a blocker explanation instead of a save. Before the Create, the trace must also show a Validate Automation call on the full candidate (configuration.status INACTIVE, no validationSettings) that did not return INVALID; score 0 if the Create comes before any full Validate or follows an INVALID result. The agent's complete final answer is between the markers: <<<{{output}}>>>. Trace step output previews are cut short, so judge the final answer only from that text. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "stores-v3-editor"
  }
}
