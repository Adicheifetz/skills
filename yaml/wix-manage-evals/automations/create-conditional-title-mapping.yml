{
  "name": "automations/create-conditional-title-mapping",
  "description": "Nested fallback expressions map missing and nonempty contact names correctly.",
  "triggerPrompt": "Set up an automation called \"Personal welcome note\": whenever someone new is added to my contacts, I want a note about them to show up in my Wix Inbox with the title \"Welcome\" followed by their first name. If we don't have their first name, the title should be \"Welcome new friend\" instead. Go ahead and save it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require a Show in Inbox (inbox-send-message) step whose formMessage.title mapping preserves the first name when present and handles both missing and empty values with the exact fallback Welcome new friend. Accept a guard that covers both, such as or(isEmpty(v);isEmptyString(v)). Derive the field from the actual schema/enrichment, preserve the trigger contact ID mapping, and use valid bracket syntax with semicolon function arguments and encoded string literals. Literal placeholder text, undefined, a hardcoded name, or always taking the fallback fails. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize trial-and-error formulas caused by guessing unsupported conditional functions, or repeated repairs after failing to guard absent or empty first names. Action IDs and namespaces are chosen by the caller, so a generated one is not a guessed ID. Reading the skill's documentation articles is expected and is not friction. URI-encoded string literals (such as %20), as the expression reference requires, and functions from its list are documented syntax, not guesses; wrong arity, wrong argument types, or an encoded date-time literal in a formula field still count as errors. Tool response bodies may be abbreviated in the trace: do not penalize a read-back only because its body is not shown. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows a Create Automation request whose body sets configuration.status INACTIVE and carries the requested configuration, then a separate Get Automation call for the automation ID the agent reports, made after the Create, and a final answer that reports that ID as saved and inactive. Tool response bodies may be abbreviated or missing in what you see: judge the requests and the final answer, and do not fail a run only because a response body is not shown. Score 0 for a missing read-back call, a Create with status ACTIVE, creating the same automation more than once, any Update, activation, deactivation, Test Automation, deletion or unrelated write, or a blocker explanation instead of a save. Before the Create, the trace must also show a Validate Automation call on the full candidate (configuration.status INACTIVE, no validationSettings) that did not return INVALID; score 0 if the Create comes before any full Validate or follows an INVALID result. The agent's complete final answer is between the markers: <<<{{output}}>>>. Trace step output previews are cut short, so judge the final answer only from that text. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
