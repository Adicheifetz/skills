{
  "name": "automations/create-conditional-title-mapping",
  "description": "Nested fallback expressions map missing and nonempty contact names correctly.",
  "triggerPrompt": "Create an automation named Personal welcome note. When a new contact is created, show a form message in my Inbox for that contact, with the form name Welcome followed by their first name. If the first name is absent or empty, use Welcome new friend instead. Go ahead and save this automation.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Require a Show in Inbox (inbox-send-message) step whose formMessage.title mapping preserves the first name when present and handles both missing and empty values with the exact fallback Welcome new friend. Derive the field from the actual schema/enrichment, preserve the trigger contact ID mapping, and use valid bracket syntax with semicolon function arguments and encoded string literals. Literal placeholder text, undefined, a hardcoded name, or always taking the fallback fails. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize trial-and-error formulas caused by guessing unsupported conditional functions, or repeated repairs after failing to guard absent or empty first names. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows a Create Automation request whose body sets configuration.status INACTIVE and carries the requested configuration, then a separate Get Automation call for the automation ID the agent reports, made after the Create, and a final answer that reports that ID as saved and inactive. Tool response bodies may be abbreviated or missing in what you see: judge the requests and the final answer, and do not fail a run only because a response body is not shown. Score 0 for a missing read-back call, a Create with status ACTIVE, creating the same automation more than once, any Update, activation, deactivation, Test Automation, deletion or unrelated write, or a blocker explanation instead of a save. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor"
  }
}
