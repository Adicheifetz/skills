{
  "name": "automations/deactivate-request",
  "description": "The user asks to turn off an active automation whose task step has an invalid input mapping; the guide turns it off with a status-only update, without validating first or repairing the step.",
  "triggerPrompt": "Please turn off my Contact Follow-up automation.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-activation-status"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows: the agent finds the Contact Follow-up automation (Query by name or Get), a Get Automation call for its ID, then exactly one Update Automation request for that ID that carries its revision and origin, plus settings exactly as the Get returned them if present, and changes only configuration.status to INACTIVE (name, trigger, actions and mappings unchanged), then a Get Automation call after the Update. Validate is not required before turning it off. Tool response bodies may be abbreviated or missing in what you see: judge the requests and the final answer. Score 0 if the automation is not turned off, if the agent refuses or delays because validation reports errors, if the Update changes, repairs or removes any step, or if the trace deletes the automation, runs Test Automation or makes unrelated writes. The agent's complete final answer is between the markers: <<<{{output}}>>>. Trace step output previews are cut short, so judge the final answer only from that text. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, an Update rejected for missing origin or settings or a stale revision, catalog calls this status change does not need, running Validate and then trying to fix the task step, and redundant confirmation after the explicit request to turn it off. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10 on the final answer to the user. Require that it says plainly Contact Follow-up is now turned off, with its ID. Score 0 if it claims the automation is still on, says it could not be turned off because of validation errors, or mentions internal rollout terms such as stage, stage 2, later stage, or not yet published. The agent's complete final answer is between the markers: <<<{{output}}>>>. Trace step output previews are cut short, so judge the final answer only from that text. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed active automation to turn off",
          "method": "post",
          "url": "https://www.wixapis.com/automations-service/v2/automations",
          "body": {
            "automation": {
              "name": "Contact Follow-up",
              "origin": "USER",
              "configuration": {
                "status": "ACTIVE",
                "trigger": {
                  "appId": "74bff718-5977-47f2-9e5f-a9fd0047fd1f",
                  "triggerKey": "contacts-new_contact_was_created",
                  "filters": []
                },
                "rootActionIds": [
                  "650c6d61-0000-4000-8000-000000000001"
                ],
                "actions": {
                  "650c6d61-0000-4000-8000-000000000001": {
                    "id": "650c6d61-0000-4000-8000-000000000001",
                    "type": "APP_DEFINED",
                    "namespace": "createTask-1",
                    "displayName": "Create follow-up task",
                    "appDefinedInfo": {
                      "appId": "146c0d71-352e-4464-9a03-2e868aabe7b9",
                      "actionKey": "createTask",
                      "inputMapping": {
                        "contactId": "{{var(\"contactId\")}}",
                        "title": "Welcome {{if(or(isEmpty(var(\"contact.name.first\"));isEmptyString(var(\"contact.name.first\")));\"new%20friend\";var(\"contact.name.first\"))}}",
                        "notASchemaField": "x"
                      },
                      "postActionIds": []
                    }
                  }
                }
              }
            }
          }
        }
      ]
    }
  }
}
