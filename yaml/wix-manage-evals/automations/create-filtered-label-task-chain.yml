{
  "name": "automations/create-filtered-label-task-chain",
  "description": "A static-key trigger filter and two chained app-defined actions persist in builder-readable shapes.",
  "triggerPrompt": "Set up an automation called \"VIP label follow-up\" that runs only when a contact gets my \"VIP follow-up\" label (its key is custom.vip-follow-up), not any other label. When that happens, I want a note about that contact in my Wix Inbox titled \"Call new VIP\", and after that a second note for the same contact titled \"Send VIP welcome gift\". Go ahead and save it.",
  "tags": [
    "automations"
  ],
  "assertions": [
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/build-and-manage-wix-automations"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-api-catalog"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-trigger-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-action-configuration"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-graph-and-data-model"
      }
    },
    {
      "tool": "ReadFullDocsArticle",
      "params": {
        "articleUrl": "https://dev.wix.com/docs/api-reference/business-management/automations/skills/automations-mapping-expressions"
      }
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Judge the automation in the agent's Create Automation request body (tool response bodies may be abbreviated in what you see). Trigger: contacts-label_added_to_contact with exactly one filter whose id is the trigger's catalog filter id (a real id the agent took from the trigger catalog, not a placeholder or invented value), whose fieldKey is exactly label.key, and whose filterExpression is the scalar shape {{contains([\"custom.vip-follow-up\"];var(\"label.key\"))}}: the value inside a literal array, double quotes, a semicolon between arguments, no spaces. Any other function, a value outside an array, a display name instead of the key, an empty filters array, or a missing or empty filterExpression fails. If the agent used a key it looked up for the seeded VIP follow-up label through the public Labels API instead of the supplied key, accept that key. Actions: exactly two APP_DEFINED Show in Inbox (inbox-send-message) nodes chained in order, Call new VIP then Send VIP welcome gift. rootActionIds holds only the first node id, the first node's postActionIds holds only the second node id, and the second node's postActionIds is empty. Node ids are unique, and namespaces are unique and follow <actionKey>-<N> numbering (for example inbox-send-message-1 and inbox-send-message-2); a reused namespace fails. Both nodes map contactId from the trigger contactId and use the exact requested form names as formMessage.title. All named requirements are mandatory: score 0 for a semantic mismatch even if the automation saved successfully. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 0-10. Inspect the actual tool trace. Require a direct path with bounded discovery, real catalog IDs, no guessed endpoints, no private tools and no unrequested side effects. Penalize recovered wrong-shaped requests, redundant confirmation after explicit authorization, repeated failed calls and claims unsupported by read-back. Penalize guessing the filter id or fieldKey instead of reading the trigger's catalog filters, trial-and-error filter expressions, repairing duplicated namespaces or broken postActionIds after a failed Validate, creating or renaming labels, and creating the automation more than once. Identify each friction and the likely docs or API gap. Return only a JSON object with score and reason."
    },
    {
      "type": "llm_judge",
      "minScore": 7,
      "prompt": "Score 10 only when the tool trace shows a Create Automation request whose body sets configuration.status INACTIVE and carries the requested configuration, then a separate Get Automation call for the automation ID the agent reports, made after the Create, and a final answer that reports that ID as saved and inactive. Tool response bodies may be abbreviated or missing in what you see: judge the requests and the final answer, and do not fail a run only because a response body is not shown. Score 0 for a missing read-back call, a Create with status ACTIVE, creating the same automation more than once, any Update, activation, deactivation, Test Automation, deletion or unrelated write, or a blocker explanation instead of a save. Return only a JSON object with score and reason."
    }
  ],
  "siteSetup": {
    "templateId": "blank-editor",
    "bootstrap": {
      "steps": [
        {
          "label": "Seed VIP follow-up",
          "method": "post",
          "url": "https://www.wixapis.com/contacts/v4/labels",
          "body": {
            "displayName": "VIP follow-up"
          }
        }
      ]
    }
  }
}
