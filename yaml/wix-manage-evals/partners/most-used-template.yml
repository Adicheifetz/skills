name: partners/most-used-template
description: >-
  Verifies the agent lists the partner's custom templates and ranks them by sites.count itself, since
  Query Templates can't sort or filter by sites.count or templateType.
triggerPrompt: >-
  Which of my templates have I used the most for client sites, and how many sites came from it?
tags: [partners]
maxTokens: 40000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/studio-workspace/skills/manage-studio-custom-templates
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user, a Wix Studio partner, asked which of their custom templates was used most for client sites.

      Pass if the agent:
      - calls POST https://www.wixapis.com/wixstudio/templates/v1/templates/query as an account-level call, AND
      - determines the most-used template from each template's sites.count (sorting the results itself), AND
      - reports the template name and its sites.count, noting the count covers sites created in this
        workspace (marketplace and downloaded-file usage isn't available through the API).

      Fail if the agent:
      - reports a template without reading sites.count, OR
      - confuses the partner's templates with the Wix public template gallery.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the tool-call trace.
      Score 0-10 (10 = direct: no wasted calls, no errors). Penalize and LIST any of: a non-2xx error
      even if recovered; a Query sort or filter on sites.count or templateType attempted (unsupported)
      and then corrected; a Get Template call per template when Query already returned sites.count;
      redundant or probing docs/schema calls. For each, name the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
