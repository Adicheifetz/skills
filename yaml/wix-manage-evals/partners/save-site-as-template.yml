name: partners/save-site-as-template
description: >-
  Verifies the agent reads the Studio custom templates skill and saves one of the partner's sites as a
  custom template with Copy Site As Template, not the Wix gallery template flow.
triggerPrompt: >-
  Save my site with ID b2c4e8f1-3a5d-47b9-8e2c-1f9a6d3b7c45 as a template called "Portfolio Starter" so I can
  reuse it for future clients.
tags: [partners]
maxTokens: 40000
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/studio-workspace/skills/manage-studio-custom-templates
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user, a Wix Studio partner, asked to save site b2c4e8f1-3a5d-47b9-8e2c-1f9a6d3b7c45 as a reusable
      template named "Portfolio Starter".

      Pass if the agent:
      - calls POST https://www.wixapis.com/wixstudio/templates/v1/templates/copy-site with
        templateName "Portfolio Starter" and siteMetaSiteIdToCopy b2c4e8f1-3a5d-47b9-8e2c-1f9a6d3b7c45, AND
      - explains the original site is unchanged and the template has its own backing site (a duplicate), so
        editing the template doesn't affect the original or sites already created from it.

      Fail if the agent:
      - uses the Wix gallery template search or meta-site create-from-template flow, OR
      - tells the user the original site itself became the template, OR
      - invents a field to set hidden or templateType PUBLIC at creation.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: >
      Rate how smoothly the Wix MCP let the agent fulfill the request. Examine the tool-call trace.
      Score 0-10 (10 = direct: no wasted calls, no errors). Penalize and LIST any of: a non-2xx error
      even if recovered; reaching for the Wix gallery template recipe first; a request body guessed
      wrong then corrected; redundant or probing docs/schema calls. For each, name the likely MCP/docs gap.
      Return ONLY {"score":<0-10>,"reason":"<terse list of frictions + suspected MCP/docs gap, or 'clean path' if none>"}.
