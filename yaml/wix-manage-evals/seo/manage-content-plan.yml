name: seo/manage-content-plan
description: >-
  Verifies the agent knows the cross-service orchestration: a Content Plan Flow
  at KEYWORD_RESEARCH may still be researching or may need a readiness-gated
  Create Content Plan release on the Blog Post Candidate service. It requests
  the missing actual flow ID and explains safe bounded recovery.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Evaluate the complete reply and tool trace for this existing flow whose
      actual contentPlanFlowId is missing. Grade the substance, not a prescribed
      order or exact phrasing. Required docs/runtime-guidance reads are allowed;
      with no flow ID, explaining future checks and asking for the ID is the
      complete outcome. API execution is neither required nor allowed.

      Passing core (score 7-8) requires ALL of:
      - Ask for the actual contentPlanFlowId, not the site ID.
      - Explain KEYWORD_RESEARCH means research is running OR done; the status
        and ten minutes of waiting do not prove readiness or failure.
      - Name GET /content-plan-keyword-research-items and require nonempty items
        matching the flow's keywordResearchId before release.
      - Name POST /create-content-plan as a once-only release if the flow still
        remains KEYWORD_RESEARCH with proven readiness; distinguish its Blog
        Post Candidate service from the Content Plan Flow service being polled.
      - Make no API call with a guessed, invented or placeholder ID; no replacement
        trigger or mutation without the actual ID.

      Score 9-10 when the passing core is accompanied by the complete recovery
      explanation: HTTP 428 on premature release, status/readiness recheck instead
      of a release retry loop, and the bounded waiting policy using supported
      real elapsed time, paced status/readiness checks and incomplete reporting
      at its deadline. Explain the capability fallback: preserve the actual ID
      and last status, report incomplete and resume later when supported timing
      or waiting is unavailable. Never infer a clock from HTTP fields or counts.

      Incorrect guidance or violation of any core ID/readiness safety rule must
      score below 7. A claim that ten minutes guarantees readiness, an instruction
      to release without matching nonempty research, or only indefinite polling
      cannot pass. Omission of an ancillary recovery detail limits a correct
      complete core reply to 7-8; it does not mean the core details are absent.
      In the reason quote or precisely identify the actual missing or incorrect
      clause and acknowledge satisfied core requirements. Do not claim the reply
      lacks readiness, endpoints or the ID request when it explicitly states them.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Examine the tool-call path and efficiency of this missing-ID follow-up,
      not the correctness checklist scored by the preceding judge. Score 0-10.
      The clean path is the required runtime guidance and recipe reads, no
      unnecessary further docs/schema searches and no API executions, then a
      focused reply asking for the missing flow ID and explaining the next action.
      Required instruction/bootstrap reads are correct, not discovery friction.
      With no flow ID, stopping for that focused follow-up is efficient; a shorter reply is not better if it loses necessary guidance.
      Score 8+ for this direct path. Penalize unnecessary discovery calls,
      repeated recipe reads, API attempts before the ID arrives, repeated
      unrelated questions, and lengthy or repetitive digressions that obscure
      the follow-up. Name the likely docs or execution gap behind each detour.
      Do not grade the reply again against every recovery detail in the first
      judge, or demand API execution when the required ID is absent.
      Return ONLY {"score":<0-10>,"reason":"<path frictions and likely gaps, or clean path>"}.
siteSetup:
  mode: template
  templateId: blank-editor
