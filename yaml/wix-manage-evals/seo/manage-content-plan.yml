name: seo/manage-content-plan
description: >-
  Verifies troubleshooting of an existing keyword-research flow without its ID:
  request the actual identifier before calls, distinguish flow stage from matching
  research readiness, and explain how to safely continue the same job.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  Can you check my existing flow? What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the missing-ID decision and the actionable diagnosis using the API
      contract, not exact wording or an exhaustive recital of later branches.
      The actual flow ID is absent, so do not require an API call or completed
      recovery in this turn. Score 7-8 when all core outcomes are present:
      - Ask for the actual contentPlanFlowId before any API execution; no guessed
        ID, site-ID substitution, latest-flow fallback or replacement trigger.
      - Explain that KEYWORD_RESEARCH means research has started and may still
        run; elapsed time alone proves neither readiness nor failure.
      - Explain the safe next action with that ID: inspect the existing flow,
        read the matching research's own status separately from flow status,
        and wait for research SUCCESS before
        Create Content Plan. Flow status or keyword-list items alone do not prove
        readiness. Recheck the same flow and release at most once only if it is
        still KEYWORD_RESEARCH; CONTENT_PLAN/SUCCESS skips release.
      Score below 7 for generic caution without the direct matching-research
      check and release prerequisite, a false claim that no public status read
      exists, omission of the actual-ID request, premature/repeated release,
      replacement triggers, guessed-ID execution, indefinite polling or promised
      completion. Score 9-10 for concise actionable guidance and relevant
      428/unsupported-read handling. Do not require literal service labels,
      every terminal enum or a hypothetical JSON request before the ID arrives.
      Naming Get Site Keyword Research or keywordResearchId is helpful but not
      required if checking this exact flow's matching research status is clear.
      Saying only to wait or read keywords without a matching status check fails.
      Cite actual missing substance and acknowledge the full reply's contents.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the path and efficiency, not the correctness checklist again.
      Score 8+ for required runtime/bootstrap and recipe reads, no unnecessary
      discovery or API execution, and a concise focused follow-up for the actual
      flow ID with the next action explained. Required reads are not friction.
      Penalize redundant docs/schema searches, repeated recipe reads, API attempts
      before the ID arrives, distracting placeholder examples, unrelated questions
      and repetitive digressions. Necessary recovery explanation is not an extra
      step. Identify the likely docs/runtime gap behind each detour; do not demand
      API execution with no ID or reward brevity that loses necessary guidance.
      Return ONLY {"score":<0-10>,"reason":"<path frictions and likely gaps, or clean path>"}.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
siteSetup:
  mode: template
  templateId: blank-editor
