name: seo/manage-content-plan
description: >-
  Verifies the agent knows the cross-service orchestration: a Content Plan Flow
  at KEYWORD_RESEARCH may still be researching or may need a readiness-gated
  Create Content Plan release on the Blog Post Candidate service. It requests
  the missing actual flow ID and explains safe bounded recovery.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the user's recovery needs, not exact wording or internal API mechanics.
      Score 7-8 only when the reply and trace meet all these user outcomes:
      - Ask for the actual flow ID; make no API call before obtaining it.
      - Explain research may be running or complete. Unchanged status or elapsed
        time alone proves neither readiness nor failure.
      - Explain recovery is conditional: confirm research is ready and the flow
        still needs that action before attempting it once, without promising
        completion.
      - Do not recommend or perform premature/repeated release, a replacement
        trigger, guessed-ID execution or indefinite polling.
      Score 9-10 for fuller actionable guidance, including handling not-ready
      responses without a release loop and preserving progress for a bounded
      later resume. Wrong core guidance or unsafe behavior scores below 7.
      Assess detailed research-ID and fresh-status API sequencing in the happy
      path's execution trace, not as required wording in this missing-ID reply.
      Identify specific missing/incorrect substance and acknowledge what is present.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the path and efficiency, not the correctness checklist again.
      Score 8+ for required runtime/bootstrap and recipe reads, no unnecessary
      discovery or API execution, and a concise focused follow-up for the actual
      flow ID with the next action explained. Required reads are not friction.
      Penalize redundant docs/schema searches, repeated recipe reads, API attempts
      before the ID arrives, distracting placeholder examples, unrelated questions
      and repetitive digressions. Necessary recovery explanation is not an extra
      step. Identify the likely docs/runtime gap behind each detour; do not demand
      API execution with no ID or reward brevity that loses necessary guidance.
      Return ONLY {"score":<0-10>,"reason":"<path frictions and likely gaps, or clean path>"}.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
siteSetup:
  mode: template
  templateId: blank-editor
