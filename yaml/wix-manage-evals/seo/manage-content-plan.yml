name: seo/manage-content-plan
description: >-
  Verifies safe troubleshooting of an existing keyword-research flow without
  its ID: request the actual identifier, explain uncertain progress and supported
  recovery limits, and avoid speculative mutations. This is a diagnostic test,
  not coverage or a success claim for parked-flow recovery.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  Can you check my existing flow? What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge specific content-plan troubleshooting knowledge, not generic caution.
      Score 7-8 only when the full reply and trace meet all these outcomes:
      - Ask for the actual flow ID and make no API call before obtaining it.
      - Explain KEYWORD_RESEARCH begins before research completes; unchanged
        status or elapsed time alone proves neither readiness nor failure.
      - Identify Create Content Plan on Blog Post Candidate as distinct from the
        Content Plan Flow status read, and explain its prerequisite: this flow's
        matching keyword research must have status SUCCESS before release.
      - Explain why the public keyword-items list cannot establish that
        prerequisite here: it is a post-completion, site-scoped read, not a
        per-research status read. Its items alone do not authorize release.
      - Give the concrete diagnostic rule: do not call Create Content Plan to
        recover this stuck flow through this recipe; no public research-status
        read is supplied to prove the prerequisite. With the actual ID, inspect
        the flow's status;
        CONTENT_PLAN/SUCCESS needs no release. If still at the keyword stage
        without supported matching readiness proof, report that specific public
        API limitation and preserve progress rather than guess or mutate.
      Score below 7 for generic "can't help"/stall caution without these specific
      cross-service and keyword-list limitations, missing the actual-ID request,
      premature/repeated release, replacement triggers, guessed-ID execution,
      indefinite polling or promised completion. Score 9-10 for a concise
      actionable explanation including premature-428/no-repeat handling where
      relevant. Do not require an unproved executable recovery procedure.
      Cite concrete missing substance and acknowledge what the full reply contains.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the path and efficiency, not the correctness checklist again.
      Score 8+ for required runtime/bootstrap and recipe reads, no unnecessary
      discovery or API execution, and a concise focused follow-up for the actual
      flow ID with the next action explained. Required reads are not friction.
      Penalize redundant docs/schema searches, repeated recipe reads, API attempts
      before the ID arrives, distracting placeholder examples, unrelated questions
      and repetitive digressions. Necessary recovery explanation is not an extra
      step. Identify the likely docs/runtime gap behind each detour; do not demand
      API execution with no ID or reward brevity that loses necessary guidance.
      Return ONLY {"score":<0-10>,"reason":"<path frictions and likely gaps, or clean path>"}.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
siteSetup:
  mode: template
  templateId: blank-editor
