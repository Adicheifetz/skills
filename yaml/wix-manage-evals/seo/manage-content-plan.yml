name: seo/manage-content-plan
description: >-
  Verifies the agent knows the cross-service orchestration: a Content Plan Flow
  at KEYWORD_RESEARCH may still be researching or may need a readiness-gated
  Create Content Plan release on the Blog Post Candidate service. It requests
  the missing actual flow ID and explains safe bounded recovery.
triggerPrompt: >-
  My SEO content plan flow has been stuck at KEYWORD_RESEARCH for 10 minutes.
  I've been polling GetContentPlanFlow and the status never changes.
  What's wrong and how do I get it to finish?
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user reports KEYWORD_RESEARCH for 10 minutes but gives no flow ID.
      Score 7+ only if the reply contains ALL these safety and recovery details:
      - Ask for the actual contentPlanFlowId before making any API call. No
        invented or placeholder ID, replacement trigger, or mutation is allowed.
      - Explain KEYWORD_RESEARCH means research is running OR done; status and
        ten minutes of waiting do not prove readiness or failure. Generation
        may start automatically, or remain parked after research is ready.
      - Name GET /content-plan-keyword-research-items and require nonempty items
        with this flow's keywordResearchId before any release.
      - Name POST /create-content-plan as the once-only release if the flow
        remains KEYWORD_RESEARCH with proven readiness; distinguish the Blog
        Post Candidate service from the Content Plan Flow service being polled.
      - Explain an early release can return HTTP 428; recheck status/readiness
        instead of retrying release in a loop.
      - Explain bounded recovery: use real elapsed time and paced status checks
        (about 15 seconds apart), readiness retries about two minutes apart,
        and report incomplete after about 15 minutes without completion.
        If supported timing/waiting is unavailable, report incomplete and resume
        later with the actual ID and last observed status. Do not invent a clock
        from updatedAt or use call counts or rapid polling as elapsed time.
      With no ID, explaining the future checks and asking for the ID is the
      complete outcome; executing those checks is neither required nor allowed.
      Score 9+ for a concise actionable reply covering all of the above.
      Score below 5 if any ID/readiness safety rule is violated, if it claims
      research must be done after ten minutes, if it only says to keep polling,
      or if it omits the release endpoint or the actual-ID request.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Score 0-10 for the quality of the same missing-ID troubleshooting reply.
      A direct reply asking for the actual ID, explaining running-or-done status,
      naming both readiness GET and once-only release POST with matching nonempty
      research as the precondition, distinguishing the services, and explaining
      paced bounded recovery scores 8+ without any API execution. Those details,
      including HTTP 428 handling and honest incomplete reporting, are required
      recovery guidance, not extra steps. Reading the required recipe is correct.
      Heavy penalties (each costs 2-3 points): missing the actual-ID request;
      invented/placeholder ID or API calls without it; premature release;
      re-triggering; claiming ten minutes proves readiness; indefinite or rapid
      polling instead of readiness-gated bounded recovery; or extensive searches
      without answering. Do not penalize the necessary explanation of future
      checks while waiting for the user's ID, or failure to execute with no ID.
      Return ONLY {"score":<0-10>,"reason":"<terse explanation>"}.
siteSetup:
  mode: template
  templateId: blank-editor
