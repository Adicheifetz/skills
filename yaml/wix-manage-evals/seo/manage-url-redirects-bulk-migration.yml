# A fresh site with no redirects, so the List Redirects check before writing finds no conflict
# and the agent can create in the same turn without stopping to ask.
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/redirects/skills/manage-url-redirects-on-a-wix-site
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user supplied a CSV of 150 old-to-new URL pairs and asked for a redirect for every one,
      then a count of how many were created. The site was provisioned empty for this run. Bulk
      Create Redirects accepts at most 100 redirects per request and rejects a larger list as a
      whole with a 400 (INVALID_ARGUMENT), writing nothing.

      Pass only if ALL of the following hold:
      - every Bulk Create Redirects call in the trace carried 100 redirects or fewer,
      - the calls together covered all 150 pairs, each pair exactly once, as exact redirects
        (no options.groupRedirect) with `from` and `to` taken from the CSV,
      - the agent read results[].itemMetadata from each response rather than trusting the HTTP
        status alone, and
      - the count it reports to the user matches what the responses (or a List Redirects call)
        show was actually created.

      Fail if any Bulk Create Redirects call carried more than 100 redirects, even if the agent
      recovered afterwards: sending an oversized batch is the exact mistake this scenario exists
      to catch. Fail if the agent created fewer than 150 redirects and did not say so, invented
      or altered paths, collapsed the list into group redirects, set options.forceReplace, or
      claimed a total it did not verify.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge the tool-call path, not the prose. Score 0-10, where 10 is a direct path: one List
      Redirects to check for conflicts, then two Bulk Create Redirects calls (for example 100 and
      50), with no errors.

      Penalize and LIST each of the following, naming the likely skill or docs gap behind it:
      - any non-2xx response, even if recovered - a 400 from an oversized Bulk Create batch
        means the agent did not know the per-request cap;
      - a batch split only after a failure rather than up front;
      - one Create Redirect call per pair instead of bulk calls;
      - calls to paths that are not part of the API, such as POST /redirects, /list-redirects
        or /redirects/query;
      - repeated List Redirects calls with no write between them, or probing calls to learn
        the request shape.

      Score 7-8 for a clean result with one minor redundant read. Score below 7 for any non-2xx
      Bulk Create response or any batch over 100.
