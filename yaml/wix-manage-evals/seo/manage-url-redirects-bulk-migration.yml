name: seo/manage-url-redirects-bulk-migration
description: >-
  Verifies that the agent migrates 150 one-to-one redirects from another platform by splitting
  them into Bulk Create Redirects calls of at most 100, the API's per-request cap, rather than
  sending one oversized batch that the API rejects with a 400.
# 150 is chosen to sit between the real cap (100) and the stale one the recipe used to quote
# (500): an agent that trusts "up to 500" sends a single call and gets INVALID_ARGUMENT back. The
# pairs are deliberately unpatterned - five old prefixes, renamed slugs - so no group redirect can
# stand in for the list, and no new path is also an old one, so no loop resolution deletes
# anything mid-run.
