name: seo/manage-content-plan-happy-path
description: >-
  Requires the full generation workflow on an isolated site with business data:
  trigger, follow the same flow through automatic generation or a readiness-gated
  release, reach SUCCESS, and report the actual candidates.
triggerPrompt: >-
  Generate an SEO content plan for my Wix site and show me the blog post topics
  it suggests.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge the FULL conversation: API inputs/results plus the final reply.
      Calls need not be narrated again in the reply. Require these three criteria:
      1. One trigger returns an actual flow ID; status results prove SUCCESS for
         that same flow before its candidates are read.
      2. The reply shows actual returned topics, available briefData keywords and
         supporting URLs, count, flow ID and SUCCESS. Weak API-generated titles
         are still actual results; fabrication or promises without topics fail.
      3. Recovery is conditional: automatic CONTENT_PLAN/SUCCESS skips readiness
         and release. If release occurs, matching nonempty readiness must be
         followed by a fresh same-flow status GET still KEYWORD_RESEARCH with
         the same research ID; release once before the shared deadline.
      Score 7+ only when all applicable criteria hold. Score 0 for incomplete,
      timeout, failure, no observed SUCCESS, no actual candidate read/topics,
      fabricated/different-flow completion, or release without the stated proof.
      Cite actual trace evidence and any specific missing criterion. Never mark
      readiness/release missing on an automatic path. Timing/efficiency is graded
      separately below.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Judge execution quality from the full trace. Require a completed result.
      Score 8+ for supported elapsed-time pacing under the chosen bounded policy,
      one HTTP request per execution, continued status checks during readiness
      waits, and at most one readiness-proven release after fresh matching status.
      Later statuses skip release; required runtime/recipe reads are correct.
      Score 0 for polling loops, busy/rapid polling or call-count/HTTP-field clocks;
      blind long readiness sleeps or skipped status cadence; stale/mismatched
      status at release; repeated triggers/releases; or starting status/readiness/
      release after the shared deadline, including automatic restarts to evade it.
      A policy-permitted late first-readiness check is valid. Expected paced 404s
      are not friction. One 428 is acceptable only after readiness proof, followed
      by status/research decisions within budget without another release.
      Observed SUCCESS ends waiting: candidates may be read even if an in-flight
      status request returns at/after the deadline. Penalize first-readiness or
      retry checks outside the chosen policy, guessed shapes, unnecessary discovery
      after an expected 404 and other non-2xx errors;
      identify the likely docs/API/provisioning gap. Use timestamps/clock evidence.
      Return ONLY {"score":<0-10>,"reason":"<trace frictions and likely gaps, or clean path>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      # Fixture provisioning only: general site properties do not populate the
      # SEO location prerequisite. Keep this internal setup out of the public skill.
      - label: seed online SEO business location
        method: post
        url: https://manage.wix.com/_api/seo-business-location-service/v1/upsert-business-location
        body:
          businessLocation:
            id: "{{siteId}}"
            physicalLocations: []
            serviceLocations: []
            online: true
      # Keyword research requires a primaryBaseUrl; template copies are drafts.
      - label: publish disposable content plan fixture
        method: post
        url: https://www.wixapis.com/site-publisher/v1/site/publish
        body: {}
      - label: set business context for content plan generation
        method: patch
        url: https://www.wixapis.com/site-properties/v4/properties
        body:
          properties:
            categories:
              primary: "Online Store"
            description: "A store selling handmade ceramic products and home goods."
          fieldMask: "categories,description"
