name: seo/manage-content-plan-happy-path
description: >-
  Requires the full generation workflow on an isolated site with business data:
  trigger, follow the same flow through automatic generation or a readiness-gated
  release, reach SUCCESS, and report the actual candidates.
triggerPrompt: >-
  Generate an SEO content plan for my Wix site and show me the blog post topics
  it suggests.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Evaluate correctness from the FULL conversation, including API inputs,
      tool results and the final reply. The final reply need not narrate calls
      already proven in the trace. Grade clock/pacing and execution efficiency
      with the separate quality judge below.

      Required completed outcome:
      - POST /content-plan-flows/trigger returns an actual contentPlanFlowId.
      - GET /content-plan-flows/{id} observes SUCCESS for that same flow.
      - After observed SUCCESS, GET that flow's /blog-post-candidates.
      - The final reply reports the actual returned topics, available nested
        briefData keywords and supporting page URLs, candidate count, actual
        flow ID and SUCCESS. Do not treat weak/repetitive API-generated titles
        as fabricated if the reply faithfully reports the returned data.

      Conditional recovery, ONLY if applicable to the observed status:
      - If the flow advances automatically to CONTENT_PLAN or SUCCESS (including
        on the first status check), keyword research has already been passed.
        No KEYWORD_RESEARCH observation, readiness GET or release POST is required. An automatic CONTENT_PLAN -> SUCCESS path
        satisfies the workflow without any keyword-research/release calls.
      - Only if latest status is KEYWORD_RESEARCH and the bounded policy permits
        readiness (normal threshold or late-transition window), check
        /content-plan-keyword-research-items before the shared deadline.
        Missing/empty/mismatched research cannot authorize a release.
      - If a release POST /create-content-plan occurs, require prior proof of
        nonempty matching research followed by a fresh status GET for the same
        flow, immediately before the release decision. That response must still
        be KEYWORD_RESEARCH with the same keywordResearchId, and the shared
        waiting deadline must not have expired. A status from before the
        readiness check does not satisfy this precondition.
        Allow at most one release. A single HTTP 428 race is
        allowed only after that readiness proof; recheck the same flow's status
        only if the shared waiting budget remains.
        CONTENT_PLAN continues status checks and SUCCESS permits candidate reading,
        without another readiness GET. Still KEYWORD_RESEARCH requires a paced
        readiness recheck without another release.

      Observed SUCCESS ends waiting: candidate reading and reporting are allowed
      even if a status request started before the deadline returns SUCCESS at or
      after it.
      Do not require more waiting/recovery calls after observed SUCCESS.

      Score 7+ only for the full completed same-flow outcome and safe applicable
      recovery. Score 0 for fabricated results, premature/ungated release,
      release after the shared deadline even if readiness was already proven,
      completion for a different flow, no observed SUCCESS, or no candidate read
      and actual topics in the final reply. Honest incomplete, timeout,
      PENDING_REQUIREMENTS or FAIL cannot pass this happy-path scenario.
      In your reason cite the actual tool-result evidence and identify any
      specific missing requirement; do not label conditional steps missing
      when their triggering status never occurred.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Score 0-10 for a clean completed generation: one trigger, paced status
      requests using real elapsed time, readiness evidence when needed, at most
      one release, observed same-flow SUCCESS, and actual candidates in the
      final reply. Require the full outcome; incomplete is not a passing run.
      Supported external waits and a single bounded wait before one HTTP
      request are correct. Routine paced status checks are not friction.
      Score 0 for a multi-request API polling loop, busy waiting, rapid polling
      used to infer elapsed time, call-count or updatedAt timing, releasing
      before nonempty matching research exists, multiple releases, repeated
      triggers, or claiming completion without reading and presenting candidates.
      Score 0 for sleeping the whole readiness interval inside a readiness GET
      execution, skipping paced status checks while awaiting first readiness or
      a readiness retry, or release without a fresh same-flow status GET after
      matching readiness was returned, or if the fresh status has a different
      keywordResearchId. Skip release if that GET shows CONTENT_PLAN or SUCCESS;
      a stale pre-readiness status is not sufficient.
      Also score 0 for starting status, readiness or release requests after the
      shared waiting deadline, including release when the deadline expired after
      a ready response, or an immediate automatic attempt restart to evade it.
      A request begun within budget may return SUCCESS at or after the deadline;
      observed SUCCESS ends waiting, and the subsequent candidate GET/report is allowed.
      Judge pacing from clock observations or execution timestamps in the trace.
      The policy's late-transition first-readiness window is valid, not an early
      check violation; it does not reset the budget or accelerate retries.
      Penalize readiness calls in earlier statuses,
      readiness checks before the bounded policy permits them, retries
      of missing/empty/mismatched research faster than its cadence, guessed
      request shapes, and unnecessary docs lookups after an expected readiness 404. A 404 at the paced readiness
      cadence is expected, not friction. One 428 is an acceptable race only
      after matching nonempty research was proven and followed by a status
      recheck; a 428 without that precondition is a safety failure. Other
      non-2xx errors should identify likely skill, API or provisioning causes.
      Return ONLY {"score":<0-10>,"reason":"<frictions and causes, or clean path>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      # Fixture provisioning only: general site properties do not populate the
      # SEO location prerequisite. Keep this internal setup out of the public skill.
      - label: seed online SEO business location
        method: post
        url: https://manage.wix.com/_api/seo-business-location-service/v1/upsert-business-location
        body:
          businessLocation:
            id: "{{siteId}}"
            physicalLocations: []
            serviceLocations: []
            online: true
      # Keyword research requires a primaryBaseUrl; template copies are drafts.
      - label: publish disposable content plan fixture
        method: post
        url: https://www.wixapis.com/site-publisher/v1/site/publish
        body: {}
      - label: set business context for content plan generation
        method: patch
        url: https://www.wixapis.com/site-properties/v4/properties
        body:
          properties:
            categories:
              primary: "Online Store"
            description: "A store selling handmade ceramic products and home goods."
          fieldMask: "categories,description"
