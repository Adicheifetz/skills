name: seo/manage-content-plan-happy-path
description: >-
  Requires the full generation workflow on an isolated site with business data:
  trigger once, monitor the same flow with supported pauses, reach SUCCESS,
  and report the actual candidates without an unproved recovery mutation.
triggerPrompt: >-
  Generate an SEO content plan for my Wix site and show me the blog post topics
  it suggests.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge actual API results and the final reply. Score 7+ only when:
      - One trigger returns an actual flow ID and status proves SUCCESS for that
        same flow before its candidates are read.
      - The reply gives actual returned topics, available briefData keywords and
        supporting URLs, count, flow ID and observed SUCCESS. Weak titles are
        still actual results; fabricated replacements or promises do not pass.
      - No unproved release or replacement trigger occurs. CONTENT_PLAN/SUCCESS
        skips release. Any recovery requires supported proof that this flow's
        matching research has status SUCCESS and a fresh same-flow status remains
        KEYWORD_RESEARCH; keyword-list items before flow completion are not that proof.
      Score 0 for incomplete/timeout/failure, no observed SUCCESS, no actual
      candidate read/topics, fabricated or different-flow completion, or an
      unproved release. Honest incomplete is safe but fails this completion task.
      Cite specific trace evidence; calls need not be narrated in the reply.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Use the FULL final reply provided by the harness for reply content.
      Completion previews may be truncated; missing preview text is not missing
      reply content. Use the tool-call trace for API and status evidence.

      Judge the observable path. Require completion for a pass. Score 8+ for:
      - One HTTP request per execution; subsequent status checks use supported
        bounded pauses, approximately the recipe's recommended cadence. The first
        check may already show SUCCESS. No multi-request polling loop, rapid/busy
        polling, unbounded sleep, or API/doc calls used as pretend waits.
      - Finite monitoring appropriate to the run, with honest incomplete reporting
        if it ends. No automatic restart, repeat trigger, unproved/repeated release
        or pre-completion keyword-list readiness heuristic. Skip release after
        CONTENT_PLAN/SUCCESS; a 428 leads to a paced status recheck, not more POSTs.
      - Actual results reported without fabrication and no unnecessary discovery
        or guessed API shapes. Required bootstrap/runtime and recipe reads are
        correct. Candidate reads after observed SUCCESS are required.
      Score below 7 for substantive pacing, safety or avoidable-path failures.
      Reserve 0 for actual unsafe mutation, polling loops, materially unbounded
      waiting or fabrication; cite the specific trace violation. Do not require
      private clock bookkeeping or exact timing constants. Missing private notes
      alone are not a safety violation. Identify likely docs/API gaps for friction.
      Return ONLY {"score":<0-10>,"reason":"<trace frictions and likely gaps, or clean path>"}.

      Full final reply (evaluate this, not the completion preview):
      {{output}}
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      # Fixture provisioning only: general site properties do not populate the
      # SEO location prerequisite. Keep this internal setup out of the public skill.
      - label: seed online SEO business location
        method: post
        url: https://manage.wix.com/_api/seo-business-location-service/v1/upsert-business-location
        body:
          businessLocation:
            id: "{{siteId}}"
            physicalLocations: []
            serviceLocations: []
            online: true
      # Keyword research requires a primaryBaseUrl; template copies are drafts.
      - label: publish disposable content plan fixture
        method: post
        url: https://www.wixapis.com/site-publisher/v1/site/publish
        body: {}
      - label: set business context for content plan generation
        method: patch
        url: https://www.wixapis.com/site-properties/v4/properties
        body:
          properties:
            categories:
              primary: "Online Store"
            description: "A store selling handmade ceramic products and home goods."
          fieldMask: "categories,description"
