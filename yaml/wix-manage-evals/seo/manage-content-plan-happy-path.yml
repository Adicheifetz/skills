name: seo/manage-content-plan-happy-path
description: >-
  Requires the full generation workflow on an isolated site with business data:
  trigger, reach KEYWORD_RESEARCH, wait for the research by checking the flow,
  release only if generation did not start on its own, reach SUCCESS, and read
  candidates.
triggerPrompt: >-
  Generate an SEO content plan for my Wix site and show me the blog post topics
  it suggests.
tags: [seo, content-plan]
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/business-management/seo/skills/generate-and-read-a-wix-site-s-content-plan
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Require evidence of ALL steps in order for the same flow:
      1. POST /content-plan-flows/trigger and retain its actual contentPlanFlowId.
      2. Read contentPlanFlow.status from GET /content-plan-flows/{id}.
         KEYWORD_RESEARCH may be skipped if CONTENT_PLAN or SUCCESS is observed.
      3. While in progress, use supported elapsed time and paced individual
         status requests following the bounded waiting policy. No call count
         or HTTP field substitutes for a clock. Each API execution makes one HTTP request;
         a supported external wait or one bounded wait before that request is
         allowed. A multi-request polling loop or busy wait is not allowed.
      4. If still KEYWORD_RESEARCH at the policy's first-readiness threshold,
         GET /content-plan-keyword-research-items. Release at most once with
         POST /create-content-plan, only if nonempty items have the flow's
         keywordResearchId and the latest status is still KEYWORD_RESEARCH.
         Skip the release if CONTENT_PLAN or SUCCESS starts on its own.
         Missing, empty or mismatched research is not ready; recheck readiness
         at the policy's readiness cadence within its bounded waiting budget.
         A single HTTP 428 race is allowed only when matching nonempty research
         items were already proven. Recheck the same flow's status: at
         CONTENT_PLAN, continue paced status checks; at SUCCESS, read candidates.
         Neither needs another readiness GET. If still KEYWORD_RESEARCH, recheck
         readiness at the paced cadence without another release.
      5. Observe SUCCESS for that same flow, then GET
         /content-plan-flows/{id}/blog-post-candidates.
      6. Report the actual returned topics, available nested briefData keywords
         and supporting page URLs, candidate count, actual flow ID and SUCCESS.
      Score 0 if any required step is missing, if results are fabricated, or
      completion is claimed for a different flow. Honest incomplete reporting
      at the policy's elapsed-time deadline, or when supported timing/waiting is
      unavailable, preserves the actual flow ID and last status but is NOT a happy-path PASS.
      PENDING_REQUIREMENTS or FAIL is also not a happy-path PASS.
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      Score 0-10 for a clean completed generation: one trigger, paced status
      requests using real elapsed time, readiness evidence when needed, at most
      one release, observed same-flow SUCCESS, and actual candidates in the
      final reply. Require the full outcome; incomplete is not a passing run.
      Supported external waits and a single bounded wait before one HTTP
      request are correct. Routine paced status checks are not friction.
      Score 0 for a multi-request API polling loop, busy waiting, rapid polling
      used to infer elapsed time, call-count or updatedAt timing, releasing
      before nonempty matching research exists, multiple releases, repeated
      triggers, or claiming completion without reading and presenting candidates.
      Judge pacing from clock observations or execution timestamps in the trace.
      Penalize readiness checks before the bounded policy permits them, retries
      of missing/empty/mismatched research faster than its cadence, guessed
      request shapes, and unnecessary docs lookups after an expected readiness 404. A 404 at the paced readiness
      cadence is expected, not friction. One 428 is an acceptable race only
      after matching nonempty research was proven and followed by a status
      recheck; a 428 without that precondition is a safety failure. Other
      non-2xx errors should identify likely skill, API or provisioning causes.
      Return ONLY {"score":<0-10>,"reason":"<frictions and causes, or clean path>"}.
siteSetup:
  mode: template
  templateId: stores-v3-editor
  bootstrap:
    steps:
      # Fixture provisioning only: general site properties do not populate the
      # SEO location prerequisite. Keep this internal setup out of the public skill.
      - label: seed online SEO business location
        method: post
        url: https://manage.wix.com/_api/seo-business-location-service/v1/upsert-business-location
        body:
          businessLocation:
            id: "{{siteId}}"
            physicalLocations: []
            serviceLocations: []
            online: true
      # Keyword research requires a primaryBaseUrl; template copies are drafts.
      - label: publish disposable content plan fixture
        method: post
        url: https://www.wixapis.com/site-publisher/v1/site/publish
        body: {}
      - label: set business context for content plan generation
        method: patch
        url: https://www.wixapis.com/site-properties/v4/properties
        body:
          properties:
            categories:
              primary: "Online Store"
            description: "A store selling handmade ceramic products and home goods."
          fieldMask: "categories,description"
