name: collaborators/invite-collaborator-with-role
description: >-
  Verifies the agent sends a collaborator invite end to end from a plain
  request: reads the manage-site-collaborators recipe, looks up a role id with
  Get Roles, then sends Bulk Invite with that role id and reports the outcome,
  without asking for confirmation. Bulk Invite may be refused on the test
  account; the judge scores the call sequence.
triggerPrompt: >-
  Invite eval-invite@example.com to my Wix site as a collaborator. Use any
  standard (predefined) role.
tags: [collaborators]
siteSetup:
  mode: template
  templateId: blank-editor
assertions:
  - tool: ReadFullDocsArticle
    params:
      articleUrl: https://dev.wix.com/docs/api-reference/account-level/user-management/sites/skills/manage-site-collaborators
  - type: llm_judge
    minScore: 7
    maxTokens: 2048
    prompt: |
      The user asked the agent to invite eval-invite@example.com to their site
      with any standard role.

      Score 8-10 if EITHER:
      (a) the agent called GET /roles-management/roles, picked a role id from
          the response (not a guessed or invented id), sent
          POST /invites/site-invite/bulk with {"policyIds":[<that id>],
          "emails":["eval-invite@example.com"]}, and told the user whether the
          invite went out (or which email failed); OR
      (b) the Bulk Invite call was refused (for example 403) and the agent
          stopped, told the user it was refused, and did not claim the invite
          was sent. Naming the likely cause (an account-level API key) is a
          bonus, not a requirement.

      Score 4-7 if the calls are right but the final report is missing or
      unclear about the outcome.

      Score 0-3 if the agent asks the user to confirm or to pick a role instead
      of acting, guesses a role id without calling Get Roles, calls Remove
      Contributor, uses the app-invite proxy endpoints, or invents an endpoint.

      Return ONLY {"score":<0-10>,"reason":"<one sentence>"}
